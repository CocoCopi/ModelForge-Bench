name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Native host tests
        run: |
          cmake -S app/src/main/cpp -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native -j"$(nproc)"
          ctest --test-dir build-native --output-on-failure

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MF_KEYSTORE_PATH: ${{ github.workspace }}/.bench.keystore
      MF_KEYSTORE_PASSWORD: ${{ secrets.MF_KEYSTORE_PASSWORD }}
      MF_KEY_PASSWORD: ${{ secrets.MF_KEY_PASSWORD }}
      MF_KEY_ALIAS: modelforge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode signing key
        env:
          MF_KEYSTORE_BASE64: ${{ secrets.MF_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MF_KEYSTORE_BASE64" ]; then
            echo "MF_KEYSTORE_BASE64 secret is missing; release builds need a signing key."
            exit 1
          fi
          printf '%s' "$MF_KEYSTORE_BASE64" | base64 -d > "$MF_KEYSTORE_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        id: apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/ModelForge-Bench-1.0.0-arm64-v8a.apk"
          echo "path=dist/ModelForge-Bench-1.0.0-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: modelforge-bench-release
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --title "ModelForge Bench ${TAG#v}" \
            --notes "ModelForge Bench ${TAG#v}: offline, on-device evaluation for ModelForge models. arm64-v8a release APK, minSdk 26. Signed checksums are in SHA256SUMS.txt." \
            --verify-tag || \
          gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
